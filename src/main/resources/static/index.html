<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <title>ChatMe — Real-time Messaging</title>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="login-page" id="username-page">
    <div class="login-glow"></div>
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="brand-name">ChatMe</span>
        </div>
        <h1 class="login-title">Good to see you.</h1>
        <p class="login-sub">Pick a name and jump in.</p>
        <form id="usernameForm" class="login-form">
            <div class="field-group">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" name="nickname" placeholder="e.g. starlord" autocomplete="off" required>
            </div>
            <div class="field-group">
                <label for="fullname">Display Name</label>
                <input type="text" id="fullname" name="realname" placeholder="e.g. Peter Quill" autocomplete="off" required>
            </div>
            <button type="submit" class="btn-enter">
                <span>Enter Chatroom</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </form>
    </div>
</div>

<!-- CHAT PAGE -->
<div class="chat-shell hidden" id="chat-page">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-brand">
                <div class="brand-icon sm">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="brand-name">ChatMe</span>
            </div>

            <div class="sidebar-section">
                <div class="section-label">
                    <span>People</span>
                    <span class="online-dot-label"><span class="online-dot"></span> Online</span>
                </div>
                <ul id="connectedUsers" class="contact-list"></ul>
            </div>

            <div class="sidebar-section">
                <div class="section-label">
                    <span>Groups</span>
                    <button id="createGroupBtn" class="btn-new-group" title="Create group">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
                    </button>
                </div>
                <ul id="groupsList" class="contact-list"></ul>
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="me-badge">
                <div class="me-avatar" id="me-avatar-letter"></div>
                <span id="connected-user-fullname" class="me-name"></span>
            </div>
            <a class="btn-logout" href="javascript:void(0)" id="logout" title="Logout">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="chat-main">
        <!-- Empty state -->
        <div class="empty-state" id="empty-state">
            <div class="empty-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
            </div>
            <h3>No conversation selected</h3>
            <p>Pick someone from the sidebar to start chatting.</p>
        </div>

        <!-- Active chat header -->
        <div class="chat-header hidden" id="chat-header">
            <div class="chat-header-info">
                <div class="chat-header-avatar" id="chat-header-avatar"></div>
                <div>
                    <div class="chat-header-name" id="chat-header-name"></div>
                    <div class="chat-header-status">Active now</div>
                </div>
            </div>
        </div>

        <!-- Messages -->
        <div class="messages-wrap" id="chat-messages"></div>

        <!-- Input bar -->
        <form id="messageForm" name="messageForm" class="input-bar hidden">
            <label class="attach-btn" for="fileInput" title="Attach file">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <input type="file" id="fileInput" class="hidden-file">
            </label>
            <input autocomplete="off" type="text" id="message" class="msg-input" placeholder="Message…">
            <button type="submit" class="btn-send">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </form>
    </main>

</div>

<!-- GROUP MODAL -->
<div class="modal-overlay hidden" id="groupModal">
    <div class="modal">
        <div class="modal-header">
            <h3>Create a Group</h3>
            <button class="modal-close" id="modalClose">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
        </div>
        <div class="field-group">
            <label for="groupNameInput">Group Name</label>
            <input type="text" id="groupNameInput" placeholder="e.g. Design Team" autocomplete="off">
        </div>
        <div class="field-group">
            <label for="groupMembersInput">Members <span class="label-hint">(nicknames, comma-separated)</span></label>
            <input type="text" id="groupMembersInput" placeholder="e.g. starlord, gamora" autocomplete="off">
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" id="modalCancel">Cancel</button>
            <button class="btn-create" id="modalCreate">Create Group</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
